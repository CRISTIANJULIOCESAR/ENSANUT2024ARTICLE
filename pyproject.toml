[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ensanut-hba1c"
version = "0.3.0"
description = "ENSANUT HbA1c SHAP clustering and hierarchical Naive Bayes workflows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "openpyxl>=3.1,<4",
  "plotly>=5.20,<7",
  "xgboost>=2.1,<4",
  "shap>=0.46,<1",
  "umap-learn>=0.5.6,<1",
  "igraph>=0.11,<1",
  "leidenalg>=0.10,<1",
  "phate>=1.0.11,<2",
  "graphtools>=1.5,<2",
  "mellon>=1.5,<2",
  "optuna>=4,<5",
  "PyComplexHeatmap>=1.7,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["jupyterlab>=4,<5", "ipykernel>=6.29,<8", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
